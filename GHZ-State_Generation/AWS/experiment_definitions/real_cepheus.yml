experiments:
  - name: "GHZ_Benchmark"
    params:
      backend_arn: "arn:aws:braket:us-west-1::device/qpu/rigetti/Cepheus-1-108Q"         # e.g. "ibmq_belem" or "ibmq_qasm_simulator" or "FakeToronto" as defined in qiskit.providers.fake_provider
      backend_architecture: "linear"         # qpus topology: "fully-connected" or "linear" 
      delta: 0.1                                  # Confidence level parameter (float)
      epsilon: 0.1                                # Accuracy level parameter (float)
      start_size: 2                     # Minimum number of qubits to start from (int, at least 2)
      max_size: 30                # Maximum number of qubits to test (int, at least 2)
      min_shots: 10                             # Minimum number of shots to use for each experiment (int, at least 1)