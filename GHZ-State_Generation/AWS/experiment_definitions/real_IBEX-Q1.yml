experiments:
  - name: "GHZ_Benchmark"
    params:
      backend_arn: "arn:aws:braket:eu-north-1::device/qpu/aqt/Ibex-Q1"         # e.g. "ibmq_belem" or "ibmq_qasm_simulator" or "FakeToronto" as defined in qiskit.providers.fake_provider
      backend_architecture: "fully-connected"         # qpus topology: "fully-connected" or "linear" 
      delta: 0.1                                  # Confidence level parameter (float)
      epsilon: 0.1                                # Accuracy level parameter (float)
      start_size: 2                     # Minimum number of qubits to start from (int, at least 2)
      max_size: 12                # Maximum number of qubits to test (int, at least 2)
      min_shots: 1                             # Minimum number of shots to use for each experiment (int, at least 1)